# Read-only demo of the app on GitHub Pages: the app runs with the demo data,
# every page is saved as static HTML (scripts/snapshot.mjs) and published —
# once in English (at the root) and once in Italian (under /it), since there
# is no server to switch the language. Actions that need the server show a
# "read-only demo" notice (components/shell/static-demo.tsx).
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ROOT: /${{ github.event.repository.name }}
  NEXT_PUBLIC_STATIC_DEMO: "1"
  NEXT_PUBLIC_DEMO_ROOT: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: English pages
        env:
          NEXT_BASE_PATH: ${{ env.ROOT }}
        run: |
          npm run build
          npx next start -p 3100 > server-en.log 2>&1 &
          node scripts/snapshot.mjs
          pkill -f "next-server|next start" || true
          sleep 3
      - name: Italian pages
        env:
          NEXT_BASE_PATH: ${{ env.ROOT }}/it
          SNAPSHOT_OUT: out/it
        run: |
          npx tsx scripts/db.ts language it
          npm run build
          npx next start -p 3100 > server-it.log 2>&1 &
          node scripts/snapshot.mjs
          pkill -f "next-server|next start" || true
          sleep 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
